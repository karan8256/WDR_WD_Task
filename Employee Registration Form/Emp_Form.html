<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        .form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        table {
            border-collapse: collapse;
            width: 500px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        th {
            background-color: #333;
            color: white;
            padding: 12px;
            font-size: 18px;
        }
        td {
            padding: 10px;
            font-size: 14px;
            vertical-align: middle;
        }
        /* Odd rows: Light red (#F0BAAF) */
        tr:nth-child(odd) {
            background-color: #F0BAAF;
        }
        /* Even rows: Light lime (#E3F29D) */
        tr:nth-child(even) {
            background-color: #E3F29D;
        }
        /* Header and Button rows override */
        tr.header-row, tr.button-row {
            background-color: transparent !important;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .buttons {
            text-align: center;
            padding: 15px;
        }
        .btn {
            padding: 8px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit {
            background-color: #4CAF50;
            color: white;
        }
        .btn-reset {
            background-color: #f44336;
            color: white;
        }
        .gender-container {
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <form action="#" method="POST">
        <table>
            <tr class="header-row">
                <th colspan="2">Employee Registration Form</th>
            </tr>
            <tr>
                <td><label for="name">Employee Name:</label></td>
                <td><input type="text" id="name" name="employee_name" required></td>
            </tr>
            <tr>
                <td><label for="email">Email ID:</label></td>
                <td><input type="email" id="email" name="email_id" required></td>
            </tr>
            <tr>
                <td><label for="password">Password:</label></td>
                <td><input type="password" id="password" name="password" required></td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td>
                    <div class="gender-container">
                        <label><input type="radio" name="gender" value="male" required> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                        <label><input type="radio" name="gender" value="other"> Other</label>
                    </div>
                </td>
            </tr>
            <tr>
                <td><label for="dob">Date of Birth:</label></td>
                <td><input type="date" id="dob" name="dob" required></td>
            </tr>
            <tr>
                <td><label for="doj">Date of Joining:</label></td>
                <td><input type="date" id="doj" name="doj" required></td>
            </tr>
            <tr>
                <td><label for="address1">Address Line 1:</label></td>
                <td><input type="text" id="address1" name="address_line1" required></td>
            </tr>
            <tr>
                <td><label for="address2">Address Line 2:</label></td>
                <td><input type="text" id="address2" name="address_line2"></td>
            </tr>
            <tr>
                <td><label for="city">City:</label></td>
                <td><input type="text" id="city" name="city" required></td>
            </tr>
            <tr>
                <td><label for="pincode">Pincode:</label></td>
                <td><input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" title="Six digit zip code" required></td>
            </tr>
            <tr>
                <td><label for="phone">Phone No:</label></td>
                <td><input type="tel" id="phone" name="phone_no" required></td>
            </tr>
            <tr class="button-row">
                <td colspan="2" class="buttons">
                    <input type="submit" value="Submit" class="btn btn-submit">
                    <input type="reset" value="Reset" class="btn btn-reset">
                </td>
            </tr>
        </table>
    </form>
</div>

</body>
</html>
